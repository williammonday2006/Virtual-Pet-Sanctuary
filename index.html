<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Pet Sanctuary</title>
</head>
<body>
    <h1>Virtual Pet Sanctuary</h1>

    <input type="text" id="petName" placeholder="Enter pet name">

    <select id="petType">
        <option value="Bunny">Bunny</option>
        <option value="Dog">Dog</option>
        <option value="Cat">Cat</option>
        <option value="Bird">Bird</option>
    </select>

    <button id="addPetButton">Add Pet</button>

    <div id="sanctuary"></div>

    <script>
        class Pet {
            constructor(name, type) {
                this.name = name;
                this.type = type;
                this.hunger = 50;
            }

            describe() {
                return `I am a ${this.type} named ${this.name}.`;
            }

            feed() {
                this.hunger -= 10;
            }
        }

        const pet1 = new Pet("Pikpik", "Bunny");
        const pet2 = new Pet("Nova", "Dog");

        const sanctuary = document.getElementById("sanctuary");
        const petNameInput = document.getElementById("petName");
        const petTypeInput = document.getElementById("petType");
        const addPetButton = document.getElementById("addPetButton");

        function addPet(name, type) {
            const pet = new Pet(name, type);

            const card = document.createElement("div");
            const title = document.createElement("h2");
            const description = document.createElement("p");
            const hungerDisplay = document.createElement("p");
            const feedButton = document.createElement("button");

            title.textContent = pet.name;
            description.textContent = pet.describe();
            hungerDisplay.textContent = `Hunger: ${pet.hunger}`;
            feedButton.textContent = "Feed";

            feedButton.addEventListener("click", () => {
                pet.feed();
                hungerDisplay.textContent = `Hunger: ${pet.hunger}`;
            });

            card.appendChild(title);
            card.appendChild(description);
            card.appendChild(hungerDisplay);
            card.appendChild(feedButton);

            sanctuary.appendChild(card);
        }

        addPet("Pikpik", "Bunny");
        addPet("Nova", "Dog");

        addPetButton.addEventListener("click", () => {
            const name = petNameInput.value.trim();
            const type = petTypeInput.value;

            if (name === "") {
                alert("Please enter a pet name.");
                return;
            }

            addPet(name, type);
            petNameInput.value = "";
        });
    </script>
</body>
</html>
